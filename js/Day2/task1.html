<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Looping Task</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#af5082] flex items-center justify-center">

    <div class="bg-white w-96 p-8 rounded-2xl shadow-2xl text-center">

        <h1 class="text-3xl font-bold text-[#af5082] mb-2">
            DAY 2
        </h1>

        <h2 class="text-xl font-semibold text-[#46b9ad] mb-6">
            Task 1 - Print Numbers
        </h2>

        <div class="bg-[#78b14e] text-white rounded-xl p-5">
            <p class="text-lg font-semibold">
                Open Console to see the output
            </p>

            <p class="text-sm mt-2">
                Press F12 → Console
            </p>
        </div>

    </div>

    <script>
        // Print numbers from 1 to 10

        for (let x = 1; x <= 10; x++) {
            console.log(x);
        }
    </script>

</body>
</html>
