<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#af5082] flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-2xl text-center">

        <h1 class="text-3xl font-bold text-[#af5082] mb-2">
            DAY 2
        </h1>

        <h2 class="text-xl font-semibold text-[#46b9ad] mb-6">
            TASK 3 - MULTIPLICATION TABLE
        </h2>

        <div class="bg-[#78b14e] text-white p-5 rounded-xl">
            <p class="font-semibold">
                Open F12 → Console
            </p>
        </div>

    </div>

    <script>
        let num = 5;

        for (let y = 1; y <= 10; y++) {
            console.log(num + " x " + y + " = " + (num * y));
        }
    </script>

</body>
</html>
