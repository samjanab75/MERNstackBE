<!DOCTYPE html>
<html>
<head>
    <title>Eligible Students</title>
</head>
<body>

    <h2>Eligible Students</h2>

    <script>

     
        const marks = [35, 78, 42, 90, 25, 67, 55];

        
        const eligibleStudents = marks.filter(function(mark) {
            return mark >= 50;
        });

 
        console.log(eligibleStudents);

    </script>

</body>
</html>
