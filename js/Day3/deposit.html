<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deposit Using Closure</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">

        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Bank Account
        </h1>

        <div class="bg-blue-50 p-4 rounded-lg mb-6">
            <p class="text-gray-600">
                Initial Balance
            </p>

            <p class="text-3xl font-bold text-blue-600">
                ₹1000
            </p>
        </div>

        <button
            onclick="depositMoney()"
            class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 mb-3">
            Deposit ₹500
        </button>

        <button
            onclick="depositMoneyAgain()"
            class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 mb-3">
            Deposit ₹200
        </button>

        <button
            onclick="showBalance()"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
            Get Balance
        </button>

        <p id="result" class="text-center text-xl font-bold text-gray-800 mt-6"></p>

    </div>


    <script>

        function createAccount() {

            let balance = 1000;

            function deposit(amount) {
                balance = balance + amount;
            }

            function getBalance() {
                console.log(balance);
                return balance;
            }

            return {
                deposit,
                getBalance
            };
        }


        let account = createAccount();


        function depositMoney() {
            account.deposit(500);
        }


        function depositMoneyAgain() {
            account.deposit(200);
        }


        function showBalance() {
            let currentBalance = account.getBalance();

            document.getElementById("result").innerText =
                "Current Balance: ₹" + currentBalance;
        }

    </script>

</body>
</html>
